<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <radialGradient id="meshGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(56, 189, 248, 0.25)"/>
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="#070a12"/>
  <rect width="100%" height="100%" fill="url(#meshGrad)"/>

  <!-- Tech Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Perspective Cyber Lines -->
  <g stroke="url(#lineGrad)" stroke-width="1.5">
    <line x1="0" y1="200" x2="1920" y2="200" opacity="0.4"/>
    <line x1="0" y1="400" x2="1920" y2="400" opacity="0.6"/>
    <line x1="0" y1="600" x2="1920" y2="600" opacity="0.4"/>
    
    <!-- Angled Circuit Traces -->
    <path d="M 100,700 L 400,400 L 700,400 L 900,200 L 1500,200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
    <path d="M 300,750 L 600,450 L 1100,450 L 1300,250 L 1800,250" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- Glowing Nodes -->
  <g fill="#38bdf8">
    <circle cx="400" cy="400" r="4" opacity="0.6"/>
    <circle cx="700" cy="400" r="5" opacity="0.8"/>
    <circle cx="900" cy="200" r="4" opacity="0.6"/>
    <circle cx="600" cy="450" r="4" opacity="0.5"/>
    <circle cx="1100" cy="450" r="5" opacity="0.7"/>
  </g>
</svg>
