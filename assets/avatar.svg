<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Cyber Glow -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Developer Silhouette / Illustration -->
  <g transform="translate(0, 10)">
    <!-- Hoodie / Body -->
    <path d="M45,160 Q100,120 155,160 L160,185 L40,185 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M72,138 L100,165 L128,138" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Neck -->
    <rect x="90" y="105" width="20" height="22" rx="4" fill="#f59e0b" opacity="0.9"/>

    <!-- Head -->
    <ellipse cx="100" cy="85" rx="32" ry="36" fill="#fcd34d"/>

    <!-- Hair -->
    <path d="M68,80 C68,55 80,45 100,45 C120,45 132,55 132,80 C125,70 115,68 100,68 C85,68 75,72 68,80 Z" fill="#0f172a"/>

    <!-- Glasses (Tech Style) -->
    <rect x="74" y="80" width="22" height="14" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="104" y="80" width="22" height="14" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="96" y1="87" x2="104" y2="87" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glass reflection -->
    <line x1="77" y1="84" x2="85" y2="90" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="107" y1="84" x2="115" y2="90" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M92,106 Q100,112 108,106" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

    <!-- Headphones -->
    <path d="M62,85 C62,56 75,40 100,40 C125,40 138,56 138,85" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
    <rect x="58" y="76" width="10" height="22" rx="4" fill="#38bdf8"/>
    <rect x="132" y="76" width="10" height="22" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Terminal Code Badge in corner -->
  <g transform="translate(130, 130)">
    <circle cx="18" cy="18" r="18" fill="#0b0f19" stroke="#10b981" stroke-width="2"/>
    <text x="18" y="23" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">&gt;_</text>
  </g>
</svg>
