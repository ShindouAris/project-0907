<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad1)" />
  <!-- Khung cửa sổ trình duyệt (Browser window) -->
  <rect x="30" y="25" width="540" height="290" rx="8" fill="#111827" stroke="#334155" stroke-width="2" />
  <!-- Nút cửa sổ (Dot controls) -->
  <circle cx="50" cy="45" r="5" fill="#ef4444" />
  <circle cx="68" cy="45" r="5" fill="#eab308" />
  <circle cx="86" cy="45" r="5" fill="#22c55e" />
  <!-- Thanh URL -->
  <rect x="110" y="38" width="440" height="15" rx="4" fill="#1e293b" />
  <text x="120" y="50" fill="#64748b" font-family="monospace" font-size="10">portfolio-dev.local</text>
  <!-- Nội dung mô phỏng wireframe -->
  <rect x="60" y="80" width="120" height="20" rx="4" fill="#06b6d4" opacity="0.8" />
  <rect x="60" y="115" width="280" height="12" rx="3" fill="#94a3b8" opacity="0.4" />
  <rect x="60" y="135" width="220" height="12" rx="3" fill="#94a3b8" opacity="0.3" />
  <!-- Các card mô phỏng -->
  <rect x="60" y="170" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="210" y="170" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="360" y="170" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <!-- Logo text -->
  <text x="300" y="300" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Personal Developer Portfolio</text>
</svg>
